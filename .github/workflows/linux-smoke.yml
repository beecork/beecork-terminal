name: Linux smoke test

# Launches a PUBLISHED Linux build on a real Ubuntu desktop stack (Xvfb) and
# checks that the app actually comes up: the process is still alive after 20 s,
# the crash log (diag.rs) recorded the launch and no panic, and a screenshot is
# attached to the run for a human look. Linux fails silently — a window that
# never fills in, an AppImage that exits at once — and nobody on the team has a
# Linux machine, so this runner is the only Linux desktop we can watch it on.
#
#   gh workflow run linux-smoke.yml -f tag=v0.1.29     # or no -f: latest release
#   gh run watch                                        # then open the run's
#                                                       # artifacts for the PNGs
#
# On demand only, and separate from release.yml on purpose: a flaky desktop
# runner must never hold a release hostage. Runs both artifacts — the AppImage
# (bundled WebKit) and the .deb (the system's WebKit) are different failure
# surfaces (CLAUDE.md "Linux").
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to test (empty = the latest release)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: appimage
          - os: ubuntu-24.04
            artifact: appimage
          - os: ubuntu-24.04
            artifact: deb
          - os: ubuntu-22.04
            artifact: deb
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} ${{ matrix.artifact }}
    steps:
      - name: Download the build
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          if [ -z "$TAG" ]; then
            # NEWEST release including PRERELEASES. `gh release view` with no tag
            # returns the newest non-prerelease, which during the documented
            # release flow is the PREVIOUS version — so a no-arg run silently
            # tested the build you were trying to replace. `--exclude-drafts`
            # because a draft has no downloadable assets, and `// ""` because an
            # empty array would otherwise yield the literal string "null".
            TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 1 \
                    --json tagName --jq '.[0].tagName // ""')
            [ -n "$TAG" ] || { echo "::error::no releases to test"; exit 1; }
          fi
          echo "testing $TAG ($ARTIFACT on $RUNNER_OS)"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          # The versioned names, so this also works for releases that predate
          # the stable-named copies.
          case "$ARTIFACT" in
            appimage)
              gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
                --pattern 'Beecork.Terminal_*_amd64.AppImage' --output app.AppImage
              chmod +x app.AppImage ;;
            deb)
              gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
                --pattern 'Beecork.Terminal_*_amd64.deb' --output app.deb ;;
          esac

      - name: Install a desktop
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          sudo apt-get update
          # xvfb: the display. x11-apps: xwd for the screenshot. fuse3: what the
          # AppImage runtime mounts with. imagemagick: xwd → png. The Mesa set
          # (libegl1 libgl1 libgles2 libgbm1 libgl1-mesa-dri) is what the
          # AppImage deliberately does NOT bundle — it must negotiate with the
          # host's driver (lib.rs) — so the host has to provide it; every
          # desktop install has it, a headless runner does not, and without
          # libEGL the binary itself fails to load ("libEGL.so.1: cannot open
          # shared object file"). mesa-dri adds llvmpipe, a software GL, so
          # WebKit has SOMETHING to composite with under Xvfb.
          # dbus: a desktop session always has a session bus; the system GTK
          # (the .deb) reaches for it through dconf before it opens a window,
          # and on a headless runner with no bus the app sat blocked forever
          # with no window and no WebKit child processes — every .deb leg,
          # 22.04 and 24.04, sandbox on or off — while the AppImage, whose
          # bundled GIO never touches D-Bus, came up fine on the same runner.
          sudo apt-get install -y xvfb x11-apps fuse3 imagemagick dbus \
            libegl1 libgl1 libgles2 libgbm1 libgl1-mesa-dri
          if [ "$ARTIFACT" = deb ]; then
            # apt (not dpkg) so the package's own dependencies — the system
            # WebKitGTK — resolve exactly as they would for a user.
            sudo apt-get install -y ./app.deb
          fi

      - name: Launch and observe
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          set -uo pipefail
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x800x24 >/dev/null 2>&1 &
          sleep 2
          # Launch from a scratch project folder, the way a user would from a
          # file manager: not from `/`, not from the AppImage's own mount.
          mkdir -p "$HOME/demo-project" && cd "$HOME/demo-project"
          # Under a session bus, like a desktop (see "Install a desktop").
          # `dbus-run-session` wraps the app, so find the app's own pid by name
          # for the liveness check rather than trusting `$!`.
          case "$ARTIFACT" in
            appimage) dbus-run-session -- "$GITHUB_WORKSPACE/app.AppImage" >"$GITHUB_WORKSPACE/app.out" 2>&1 & ;;
            deb)      dbus-run-session -- beecork-terminal                  >"$GITHUB_WORKSPACE/app.out" 2>&1 & ;;
          esac
          WRAPPER=$!
          sleep 20
          xwd -root -silent | convert xwd:- "$GITHUB_WORKSPACE/screenshot.png" || true
          # -f on the full command line, anchored: the kernel's process NAME is
          # cut at 15 chars and "beecork-terminal" is 16, so `pgrep -x` never
          # matches. The anchor keeps the dbus-run-session wrapper (whose
          # command line merely ENDS in the name) out of the match.
          alive=0; pgrep -f '^(/.*/)?beecork-terminal$' >/dev/null && alive=1
          LOG="$HOME/.local/share/com.beecork.terminal/logs/beecork-terminal.log"
          echo "::group::stdout / stderr"; cat "$GITHUB_WORKSPACE/app.out" || true; echo "::endgroup::"
          echo "::group::crash log ($LOG)"; cat "$LOG" 2>/dev/null || echo "(no log file)"; echo "::endgroup::"
          echo "::group::where the log could be (env + search)"
          env | grep -E '^(HOME|XDG_[A-Z_]+)=' || true
          find "$HOME" -maxdepth 6 -name 'beecork-terminal.log*' 2>/dev/null || true
          ls -la "$HOME/.local/share" 2>/dev/null || echo "(no ~/.local/share)"
          echo "::endgroup::"
          echo "::group::processes, sandbox and AppArmor evidence"
          ps -eo pid,ppid,stat,etimes,cmd --forest | grep -i -E "beecork|WebKit|bwrap|xdg-dbus" | grep -v grep || echo "(no matching processes)"
          sysctl kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo "(sysctl not present — older kernel/AppArmor)"
          sudo dmesg 2>/dev/null | grep -i -E "apparmor|bwrap|userns" | tail -n 8 || true
          dpkg-query -W -f='${Package} ${Version}\n' libwebkit2gtk-4.1-0 2>/dev/null || echo "(system webkit not installed — AppImage leg)"
          echo "::endgroup::"
          pkill -f '^(/.*/)?beecork-terminal$' 2>/dev/null || true
          kill "$WRAPPER" 2>/dev/null || true
          if [ "$alive" != 1 ]; then
            echo "::error::the app exited within 20 s — see stdout/stderr above"
            exit 1
          fi
          # What the log must contain depends on the build (diag.rs):
          #   v0.1.29    [launch] written from setup, i.e. after the window exists
          #   v0.1.30+   [launch] before GTK/WebKit init, [ready] from setup
          #   v0.1.32+   [painted] from the webview, after a composited frame
          # [ready] means the window was CREATED, not drawn — a Fedora white
          # window logged [ready] and then its web process aborted. [painted] is
          # the only marker that means a user would see something, so assert it
          # wherever the build has it.
          at_least() { [ "$(printf '%s\n' "$1" "$TAG" | sort -V | head -n1)" = "$1" ]; }
          if [ -f "$LOG" ]; then
            grep -q '\[launch\]' "$LOG" || { echo "::error::no [launch] line in the crash log"; exit 1; }
            if grep -q '\[PANIC\]' "$LOG"; then echo "::error::a panic was logged"; exit 1; fi
            if at_least v0.1.30 && ! grep -q '\[ready\]' "$LOG"; then
              echo "::error::[launch] but no [ready] — the process is alive but the window/webview was never created"
              exit 1
            fi
            if at_least v0.1.32 && ! grep -q '\[painted\]' "$LOG"; then
              echo "::error::[ready] but no [painted] — the window exists and NOTHING was drawn in it (the white-window failure)"
              exit 1
            fi
          elif at_least v0.1.30; then
            echo "::error::no crash log at all on a build that writes it before anything else — the log dir could not be created"
            exit 1
          else
            echo "::warning::no crash log — on v0.1.29 that means setup() never ran: alive, but the window never came up"
          fi
          echo "alive after 20 s; no panic logged. Open the screenshot artifact to see the window."

      - name: Attach the screenshot and output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-${{ matrix.os }}-${{ matrix.artifact }}-${{ strategy.job-index }}
          path: |
            screenshot.png
            app.out
          if-no-files-found: warn

  # Fedora, in a container, because THIS is where the AppImage breaks and the
  # Ubuntu legs above never will.
  #
  # A Fedora 44 user (Mesa 26, Wayland, Intel) got a white screen from the 0.1.30
  # AppImage: the bundled WebKitGTK — an Ubuntu 22.04-era build — aborts in its own
  # EGL init against a modern Mesa ("Could not create default EGL display:
  # EGL_BAD_PARAMETER. Aborting..."), taking WebKitWebProcess down with SIGABRT.
  # The machine's own EGL/GL was healthy; only the BUNDLED stack failed, and no env
  # variable helped (DMABUF, compositing, llvmpipe, GDK_BACKEND, sandbox, EGL_PLATFORM
  # all still aborted) because the bundle is an internally consistent OLD set —
  # swapping one library cascades into GStreamer and GLib. The .rpm, which links the
  # HOST's webkit2gtk4.1, works. So: the rpm is the supported Fedora artifact and is
  # what this job gates on; the AppImage is probed too, reported but never fatal, so
  # we notice the day a newer bundled WebKit fixes it.
  #
  # The container carries Fedora's own Mesa userspace, which is what the bundled
  # WebKit negotiates against — that is what reproduces here without a Fedora runner.
  fedora:
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - name: Download the builds
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          dnf -y install gh findutils >/dev/null
          if [ -z "$TAG" ]; then
            # See the smoke job above: newest INCLUDING prereleases, or a no-arg
            # run tests the release you just replaced.
            TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 1 \
                    --json tagName --jq '.[0].tagName // ""')
            [ -n "$TAG" ] || { echo "::error::no releases to test"; exit 1; }
          fi
          echo "testing $TAG (fedora rpm + AppImage probe)"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'Beecork.Terminal-*.x86_64.rpm' --output app.rpm
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'Beecork.Terminal_*_amd64.AppImage' --output app.AppImage
          chmod +x app.AppImage

      - name: Install the rpm against Fedora's own stack
        run: |
          set -euo pipefail
          # No --nodeps: the point is that Fedora RESOLVES libwebkit2gtk-4.1.so.0
          # itself. If this ever fails, the rpm's dependencies are wrong.
          dnf -y install ./app.rpm
          # xorg-x11-apps: xwd, ImageMagick: convert — for the per-case screenshot.
          dnf -y install xorg-x11-server-Xvfb mesa-dri-drivers dbus-daemon procps-ng \
                         xorg-x11-apps ImageMagick >/dev/null
          rpm -q webkit2gtk4.1 mesa-dri-drivers || true

      - name: Launch both and compare
        run: |
          set -uo pipefail
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x800x24 >/dev/null 2>&1 &
          sleep 2
          mkdir -p /tmp/demo && cd /tmp/demo
          LOG="$HOME/.local/share/com.beecork.terminal/logs/beecork-terminal.log"

          run_one() { # run_one <label> <command…>
            local label="$1"; shift
            rm -f "$LOG"
            dbus-run-session -- "$@" >"/tmp/$label.out" 2>&1 &
            sleep 15
            local alive=0
            pgrep -f '^(/.*/)?beecork-terminal$' >/dev/null && alive=1
            # A screenshot per case, like the `smoke` job has. This job gates on
            # `[painted]`, and when that assertion fails the picture is the first
            # thing a human wants — a grey window and a white one are the same
            # log line but two different bugs.
            xwd -root -silent | convert xwd:- "/tmp/$label.png" || true
            echo "::group::$label (alive=$alive)"
            cat "/tmp/$label.out" || true
            echo "--- log ---"; cat "$LOG" 2>/dev/null || echo "(no log)"
            echo "::endgroup::"
            pkill -f '^(/.*/)?beecork-terminal$' 2>/dev/null || true
            sleep 1
            # "came up" = something was actually DRAWN (diag.rs [painted]).
            # [ready] alone is not enough and would have lied here: the AppImage
            # on Fedora logs [launch] and [ready], stays alive, and then its web
            # process aborts in EGL init — a white window this function once
            # cheerfully called a success. Older builds have no [painted], so
            # fall back to [ready] for them and say so.
            [ "$alive" = 1 ] || return 1
            if [ "$(printf '%s\n' v0.1.32 "$TAG" | sort -V | head -n1)" = v0.1.32 ]; then
              grep -q '\[painted\]' "$LOG" 2>/dev/null
            else
              echo "note: $TAG predates [painted]; falling back to [ready], which cannot see a white window"
              grep -q '\[ready\]' "$LOG" 2>/dev/null
            fi
          }

          if run_one rpm beecork-terminal; then
            echo "rpm: came up on Fedora's system WebKit"
          else
            echo "::error::the .rpm did not come up on Fedora — the supported Linux path is broken"
            exit 1
          fi

          # Probe only. Expected to fail while we bundle an old WebKit; when this
          # starts passing, the bundled stack has caught up with modern Mesa and
          # the download page can stop steering Fedora users away from it.
          #
          # APPIMAGE_EXTRACT_AND_RUN: a container has no /dev/fuse, so the runtime
          # cannot mount its own squashfs and dies with "fuse: device not found"
          # LONG before it reaches the EGL init we are actually testing. Without
          # this the probe always "fails as expected" and tells us nothing —
          # it would still report failure the day the bundle starts working.
          export APPIMAGE_EXTRACT_AND_RUN=1
          if run_one appimage "$GITHUB_WORKSPACE/app.AppImage"; then
            echo "::warning::the AppImage now works on Fedora — revisit the download page's Linux guidance"
          else
            # Say WHY, so a future reader can tell the real EGL abort from a
            # broken probe. The reported failure is an abort inside the bundled
            # WebKit's own EGL init; anything else here is the harness, not the bug.
            if grep -q "Could not create default EGL display" /tmp/appimage.out; then
              echo "AppImage aborts in bundled-WebKit EGL init, as reported (bundled WebKit vs modern Mesa)"
            else
              echo "::warning::AppImage did not come up, but NOT with the reported EGL error — check /tmp/appimage.out in the log above; the probe may be broken rather than the app"
            fi
          fi

      - name: Attach the Fedora screenshots and output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-fedora
          path: |
            /tmp/*.png
            /tmp/*.out
          if-no-files-found: warn

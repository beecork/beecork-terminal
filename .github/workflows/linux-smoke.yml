name: Linux smoke test

# Launches a PUBLISHED Linux build on a real Ubuntu desktop stack (Xvfb) and
# checks that the app actually comes up: the process is still alive after 20 s,
# the crash log (diag.rs) recorded the launch and no panic, and a screenshot is
# attached to the run for a human look. Linux fails silently — a window that
# never fills in, an AppImage that exits at once — and nobody on the team has a
# Linux machine, so this runner is the only Linux desktop we can watch it on.
#
#   gh workflow run linux-smoke.yml -f tag=v0.1.29     # or no -f: latest release
#   gh run watch                                        # then open the run's
#                                                       # artifacts for the PNGs
#
# On demand only, and separate from release.yml on purpose: a flaky desktop
# runner must never hold a release hostage. Runs both artifacts — the AppImage
# (bundled WebKit) and the .deb (the system's WebKit) are different failure
# surfaces (CLAUDE.md "Linux").
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to test (empty = the latest release)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: appimage
          - os: ubuntu-24.04
            artifact: appimage
          - os: ubuntu-24.04
            artifact: deb
          # Diagnostic legs. The system WebKitGTK on 24.04 hangs at webview
          # creation here (alive, no window mapped, no `[ready]`), while the
          # AppImage's bundled 22.04 WebKit on the SAME runner comes up fine.
          # Neither WEBKIT_DISABLE_DMABUF_RENDERER=0 nor
          # WEBKIT_DISABLE_COMPOSITING_MODE=1 changed it (tried). The suspect is
          # 24.04's AppArmor restriction on unprivileged user namespaces, which
          # breaks WebKit's bubblewrap web-process sandbox — so: the same .deb
          # with the sandbox off (diagnostic ONLY, never a user instruction),
          # and the .deb on 22.04, which has no such restriction.
          # `extra_env` is applied to the app's environment only.
          - os: ubuntu-24.04
            artifact: deb
            extra_env: WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1
          - os: ubuntu-22.04
            artifact: deb
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} ${{ matrix.artifact }} ${{ matrix.extra_env }}
    steps:
      - name: Download the build
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          if [ -z "$TAG" ]; then
            TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          fi
          echo "testing $TAG ($ARTIFACT on $RUNNER_OS)"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          # The versioned names, so this also works for releases that predate
          # the stable-named copies.
          case "$ARTIFACT" in
            appimage)
              gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
                --pattern 'Beecork.Terminal_*_amd64.AppImage' --output app.AppImage
              chmod +x app.AppImage ;;
            deb)
              gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
                --pattern 'Beecork.Terminal_*_amd64.deb' --output app.deb ;;
          esac

      - name: Install a desktop
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          sudo apt-get update
          # xvfb: the display. x11-apps: xwd for the screenshot. fuse3: what the
          # AppImage runtime mounts with. imagemagick: xwd → png. The Mesa set
          # (libegl1 libgl1 libgles2 libgbm1 libgl1-mesa-dri) is what the
          # AppImage deliberately does NOT bundle — it must negotiate with the
          # host's driver (lib.rs) — so the host has to provide it; every
          # desktop install has it, a headless runner does not, and without
          # libEGL the binary itself fails to load ("libEGL.so.1: cannot open
          # shared object file"). mesa-dri adds llvmpipe, a software GL, so
          # WebKit has SOMETHING to composite with under Xvfb.
          sudo apt-get install -y xvfb x11-apps fuse3 imagemagick \
            libegl1 libgl1 libgles2 libgbm1 libgl1-mesa-dri
          if [ "$ARTIFACT" = deb ]; then
            # apt (not dpkg) so the package's own dependencies — the system
            # WebKitGTK — resolve exactly as they would for a user.
            sudo apt-get install -y ./app.deb
          fi

      - name: Launch and observe
        env:
          ARTIFACT: ${{ matrix.artifact }}
          EXTRA_ENV: ${{ matrix.extra_env }}
        run: |
          set -uo pipefail
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x800x24 >/dev/null 2>&1 &
          sleep 2
          # Launch from a scratch project folder, the way a user would from a
          # file manager: not from `/`, not from the AppImage's own mount.
          mkdir -p "$HOME/demo-project" && cd "$HOME/demo-project"
          case "$ARTIFACT" in
            appimage) env $EXTRA_ENV "$GITHUB_WORKSPACE/app.AppImage" >"$GITHUB_WORKSPACE/app.out" 2>&1 & ;;
            deb)      env $EXTRA_ENV beecork-terminal               >"$GITHUB_WORKSPACE/app.out" 2>&1 & ;;
          esac
          APP=$!
          sleep 20
          xwd -root -silent | convert xwd:- "$GITHUB_WORKSPACE/screenshot.png" || true
          alive=0; kill -0 "$APP" 2>/dev/null && alive=1
          LOG="$HOME/.local/share/com.beecork.terminal/logs/beecork-terminal.log"
          echo "::group::stdout / stderr"; cat "$GITHUB_WORKSPACE/app.out" || true; echo "::endgroup::"
          echo "::group::crash log ($LOG)"; cat "$LOG" 2>/dev/null || echo "(no log file)"; echo "::endgroup::"
          echo "::group::where the log could be (env + search)"
          env | grep -E '^(HOME|XDG_[A-Z_]+)=' || true
          find "$HOME" -maxdepth 6 -name 'beecork-terminal.log*' 2>/dev/null || true
          ls -la "$HOME/.local/share" 2>/dev/null || echo "(no ~/.local/share)"
          echo "::endgroup::"
          echo "::group::processes, sandbox and AppArmor evidence"
          ps -eo pid,ppid,stat,etimes,cmd --forest | grep -i -E "beecork|WebKit|bwrap|xdg-dbus" | grep -v grep || echo "(no matching processes)"
          sysctl kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo "(sysctl not present — older kernel/AppArmor)"
          sudo dmesg 2>/dev/null | grep -i -E "apparmor|bwrap|userns" | tail -n 8 || true
          dpkg-query -W -f='${Package} ${Version}\n' libwebkit2gtk-4.1-0 2>/dev/null || echo "(system webkit not installed — AppImage leg)"
          echo "::endgroup::"
          kill "$APP" 2>/dev/null || true
          if [ "$alive" != 1 ]; then
            echo "::error::the app exited within 20 s — see stdout/stderr above"
            exit 1
          fi
          # What the log must contain depends on the build (diag.rs):
          #   v0.1.29         [launch] written from setup, i.e. after the window exists
          #   v0.1.30+        [launch] written before GTK/WebKit init, [ready] from setup
          # So on 0.1.30+ a missing file is a failure, and a [launch] without a
          # [ready] is THE blank-window signature — alive, but the webview never
          # came up.
          newer_than_0_1_29=0
          [ "$(printf '%s\n' v0.1.30 "$TAG" | sort -V | head -n1)" = v0.1.30 ] && newer_than_0_1_29=1
          if [ -f "$LOG" ]; then
            grep -q '\[launch\]' "$LOG" || { echo "::error::no [launch] line in the crash log"; exit 1; }
            if grep -q '\[PANIC\]' "$LOG"; then echo "::error::a panic was logged"; exit 1; fi
            if [ "$newer_than_0_1_29" = 1 ] && ! grep -q '\[ready\]' "$LOG"; then
              echo "::error::[launch] but no [ready] — the process is alive but the window/webview never came up"
              exit 1
            fi
          elif [ "$newer_than_0_1_29" = 1 ]; then
            echo "::error::no crash log at all on a build that writes it before anything else — the log dir could not be created"
            exit 1
          else
            echo "::warning::no crash log — on v0.1.29 that means setup() never ran: alive, but the window never came up"
          fi
          echo "alive after 20 s; no panic logged. Open the screenshot artifact to see the window."

      - name: Attach the screenshot and output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-${{ matrix.os }}-${{ matrix.artifact }}-${{ strategy.job-index }}
          path: |
            screenshot.png
            app.out
          if-no-files-found: warn

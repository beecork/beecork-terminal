name: Release

# Cut a release by bumping the version in ALL FOUR files, then tagging:
#   package.json + src-tauri/tauri.conf.json + src-tauri/Cargo.toml +
#   src-tauri/Cargo.lock  (Tauri reads tauri.conf.json for the bundle + updater,
#   so `npm version` alone is NOT enough; a stale Cargo.lock dirties the build
#   tree). `npm install` refreshes package-lock.json for you.
#     git commit -am vX.Y.Z
#     git tag -a vX.Y.Z -m vX.Y.Z   # MUST be annotated: --follow-tags pushes only those
#     git push --follow-tags
#     gh workflow run release.yml --ref vX.Y.Z   # pushing the tag does NOT reliably
#                                                # start a run — dispatch it
# The run does tests + dependency audits, then a matrix build on mac/win/linux
# that publishes a GitHub Release with the installers and the signed updater
# manifest (latest.json). See RELEASING.md "Cutting a release" — including the
# step that confirms the release actually published.

# Dispatch only. The `on: push: tags` trigger used to fire a SECOND run for every
# tag push, racing the dispatched one — cancelled by hand on all five recent
# releases. It was also unreliable in the other direction (a tag push has arrived
# ~20 minutes late, and v0.1.24 built green and published nothing), which is why
# RELEASING.md has always said to dispatch. One trigger, one run.
on:
  workflow_dispatch:

jobs:
  # Gate: run tests + dependency audits before anything is built and published.
  checks:
    runs-on: ubuntu-22.04
    steps:
      # This workflow publishes under `github.ref_name`. On a `--ref main`
      # dispatch that is the string "main": a real, published release tagged
      # `main` that instantly becomes releases/latest for every download button
      # AND the updater — and the releases API CREATES refs/tags/main, which then
      # shadows the branch forever. A failing STEP is loud; a job-level `if:`
      # would skip `release` too and the run would go green having done nothing,
      # which is v0.1.24's exact shape.
      - name: Refuse to release from a non-tag ref
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          echo "::error::release.yml must run on a vX.Y.Z tag ref, not ${{ github.ref }}."
          echo "::error::Dispatch with: gh workflow run release.yml --ref vX.Y.Z"
          exit 1
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # 22 (LTS), not 20: jsdom's bundled undici calls
          # `webidl.util.markAsUncloneable`, which Node 20 doesn't have, so the
          # component tests couldn't even start a worker there. GitHub also now
          # flags Node 20 as deprecated on its runners. Matches local dev.
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      # The updater manifest (latest.json) advertises the version from
      # tauri.conf.json, NOT the git tag — so a tag that doesn't match it would
      # publish a release that installed clients never see as an update. Fail
      # fast if they disagree. Always runs: the step above refuses any ref that
      # is not a tag, so the old `if:` here was unreachable-false — and its
      # comment claimed dispatched runs skipped this gate, which was never true.
      # A `--ref vX.Y.Z` dispatch IS a tag ref and IS checked (proven on v0.1.32).
      - name: Verify tag matches every versioned file
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          FAIL=""
          check() {
            if [ "$2" != "$TAG" ]; then
              echo "::error::$1 is $2, but the tag is v$TAG"
              FAIL="yes"
            else
              echo "  ok  $1 = $2"
            fi
          }
          check package.json      "$(node -p "require('./package.json').version")"
          check package-lock.json "$(node -p "require('./package-lock.json').version")"
          check tauri.conf.json   "$(node -p "require('./src-tauri/tauri.conf.json').version")"
          check Cargo.toml        "$(grep -m1 '^version = ' src-tauri/Cargo.toml | sed -E 's/^version = "(.*)"/\1/')"
          check Cargo.lock        "$(awk '/^name = "beecork-terminal"$/{getline; sub(/^version = "/,""); sub(/"$/,""); print; exit}' src-tauri/Cargo.lock)"
          if [ -n "$FAIL" ]; then
            echo "::error::Version bump is incomplete — every file above must match the tag. See RELEASING.md."
            exit 1
          fi
          echo "version OK: $TAG"
      # The page links names only release.yml produces. Nothing tied the two
      # together, and the AppImage link in the page's prose (not a card) is
      # exactly what a hand rename misses. `<` = published but not linked,
      # `>` = linked but not published — a `>` is a live 404 on the site.
      - name: The download page links exactly the names release.yml publishes
        run: |
          set -euo pipefail
          diff <(grep -oE 'publish +Beecork-Terminal-[A-Za-z0-9._-]+' \
                   .github/workflows/release.yml | awk '{print $2}' | sort -u) \
               <(grep -oE 'releases/latest/download/[A-Za-z0-9._-]+' \
                   site/terminal/index.html | sed 's|.*/||' | sort -u) \
            || { echo "::error::release.yml and site/terminal/index.html disagree about the stable asset names. Rename in BOTH — see RELEASING.md."; exit 1; }

      # `cargo test` compiles the Tauri crate, which on Linux needs the WebKitGTK/
      # glib system libs AND libasound2-dev (ALSA headers for rodio/cpal, the native
      # sound engine) — same set the release job installs for its ubuntu leg.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev \
            libasound2-dev
      - name: Install frontend dependencies
        run: npm ci
      - name: Frontend tests
        run: npm test
      # Blocking on ERRORS only. The config keeps the React-hooks rules and
      # switches off what `tsc` already covers; the handful of remaining
      # warnings are deliberate deps decisions documented at each site.
      - name: Lint frontend
        run: npm run lint
      - name: Rust tests
        run: cd src-tauri && cargo test
      - name: Audit npm dependencies
        run: npm audit --audit-level=high
      - name: Audit Rust dependencies
        # Blocking: fails on any new advisory. A short, justified ignore-list for
        # unfixable transitive advisories lives in src-tauri/.cargo/audit.toml.
        run: |
          # Pinned like every action in this workflow: --locked pins cargo-audit's
          # own dependencies but NOT cargo-audit itself, so without --version each
          # release compiles whatever is newest on crates.io — an unpinned binary
          # holding a release gate. Bump deliberately.
          cargo install cargo-audit --locked --version 0.22.2
          cd src-tauri && cargo audit

  # Create the release ourselves, as a PRERELEASE, before anything builds.
  #
  # Otherwise the first matrix leg to finish creates it with releaseDraft:false
  # and it becomes `releases/latest` on the spot — while five of the six stable
  # names, and latest.json, do not exist yet. Measured on v0.1.29: the Windows
  # download card 404'd for 4m17s and the UPDATER endpoint for 4m05s.
  #
  # A prerelease is never `releases/latest`, so every download link and the
  # updater keep resolving to the previous, COMPLETE release for the whole build.
  # tauri-action finds it by tag and only uploads — it does NOT patch an existing
  # release's metadata (its `create-release.ts` returns the found release
  # unmodified and contains no updateRelease call), so `prerelease: false` below
  # applies only on creation and cannot promote this. A DRAFT would NOT work:
  # get-by-tag cannot find drafts.
  #
  # It also removes a failure class: pre-creating means tauri-action never calls
  # the create-a-release API — the exact call that failed with "Resource not
  # accessible by integration" on v0.1.24 and on two v0.1.30 dispatches.
  #
  # KNOWN TRADE: a release nobody promotes ships to nobody — v0.1.24's shape,
  # deliberately reintroduced. That is a forgettable step producing a loud,
  # one-command-to-fix "nothing shipped", traded against a guaranteed 4-minute
  # user-facing outage every single release. verify's "Not promoted" notice
  # prints the promote command, and linux-smoke now tests the prerelease.
  #
  # Promotion stays a HUMAN act, after linux-smoke.yml. A green build proves the
  # code compiled, not that the app starts — auto-promoting would have shipped
  # v0.1.30's white-window AppImage.
  prepare:
    needs: checks
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Pre-create the release as a prerelease
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Re-dispatch of a run that already got this far (v0.1.30 needed three).
            state=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
                      --json isPrerelease --jq 'if .isPrerelease then "prerelease" else "LIVE" end')
            echo "::notice::$TAG already exists as a $state; reusing it"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
              --title "Beecork Terminal $TAG" \
              --notes "Download the installer for your platform below. See the assets."
          fi

  release:
    needs: [checks, prepare]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest # Intel
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            target: ""
            args: ""
          - platform: windows-latest
            target: ""
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # 22 (LTS), not 20: jsdom's bundled undici calls
          # `webidl.util.markAsUncloneable`, which Node 20 doesn't have, so the
          # component tests couldn't even start a worker there. GitHub also now
          # flags Node 20 as deprecated on its runners. Matches local dev.
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev \
            libasound2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ---- macOS code signing + notarization (see RELEASING.md) ----
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # ---- Tauri auto-updater signing (REQUIRED — createUpdaterArtifacts is on;
          #      never regenerate this key or installed apps can't verify updates. See RELEASING.md §3) ----
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Beecork Terminal ${{ github.ref_name }}"
          releaseBody: "Download the installer for your platform below. See the assets."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # The download page links STABLE names — `releases/latest/download/<name>`
      # always resolves to the newest release — so it works with no GitHub API
      # call and no knowledge of the version. The API path failed in a room: the
      # unauthenticated limit is 60 requests/hour PER IP, and a group on one
      # Wi-Fi shares one IP, so the page went dead exactly when everyone was
      # asked to download at once. These are byte-identical copies of the
      # versioned assets above; the updater keeps using those via latest.json.
      # The names are part of the site — change site/terminal/index.html too.
      - name: Publish stable-named installer copies
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          # `--target` legs bundle under target/<triple>/; the others under target/.
          bundle="src-tauri/target/${TARGET:+$TARGET/}release/bundle"
          publish() { # publish <stable-name> <the one file the glob matched>
            local name="$1"; shift
            if [ "$#" -ne 1 ]; then
              echo "::error::expected exactly one artifact for $name, found $#: $*"
              exit 1
            fi
            cp "$1" "$name"
            gh release upload "$TAG" "$name" --clobber
            echo "published $name  <-  $1"
          }
          case "$RUNNER_OS:$TARGET" in
            macOS:aarch64-apple-darwin) publish Beecork-Terminal-macOS-AppleSilicon.dmg "$bundle"/dmg/*.dmg ;;
            macOS:x86_64-apple-darwin)  publish Beecork-Terminal-macOS-Intel.dmg        "$bundle"/dmg/*.dmg ;;
            Windows:*)                  publish Beecork-Terminal-Windows-x64-setup.exe  "$bundle"/nsis/*-setup.exe ;;
            Linux:*)                    publish Beecork-Terminal-Linux-x86_64.AppImage  "$bundle"/appimage/*.AppImage
                                        publish Beecork-Terminal-Linux-amd64.deb        "$bundle"/deb/*.deb
                                        publish Beecork-Terminal-Linux-x86_64.rpm       "$bundle"/rpm/*.rpm ;;
            *) echo "::error::unexpected matrix leg $RUNNER_OS:$TARGET"; exit 1 ;;
          esac

  # A release is not "done" when the matrix is green — v0.1.24 built green and
  # shipped nothing, and RELEASING.md's documented check prints the same asset
  # list for a promoted release and an unpromoted prerelease. This answers
  # "is it whole?" authoritatively, and reports the promotion state.
  verify:
    needs: release
    # Run even when a leg FAILED: a partial release is exactly what this is for,
    # and "missing asset X" beats reading four matrix logs. Skipped only when
    # `checks` gated the build out — nothing was built, nothing to verify.
    if: ${{ !cancelled() && needs.release.result != 'skipped' }}
    uses: ./.github/workflows/verify-release.yml
    with:
      tag: ${{ github.ref_name }}
    permissions:
      contents: read

[package]
name = "beecork-terminal"
version = "0.1.26"
description = "A desktop cockpit for CLI coding agents — terminal, live diff, and file browser."
authors = ["Beecork"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "beecork_terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
base64 = "0.22"
notify = "6"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
sysinfo = "0.38.4"
trash = "5"
# Native sound: synthesized chimes played through the OS mixer, so they never
# suffer WKWebView's AudioContext suspend/zombie death. default-features off — we
# feed raw samples (SamplesBuffer), so none of the format decoders are needed.
rodio = { version = "0.20", default-features = false }

# Windows only, and only to open a URL. `cmd /C start` re-parses `&`, `|`, `^` in
# the URL as command separators and expands `%VAR%`, and Rust quotes a Windows
# argument only when it contains a space — so a space-free URL printed by any
# program an agent runs reached cmd raw and could run a second command on click.
# This plugin's free `open_url` uses ShellExecuteExW: no shell in the path. It
# enables `open`'s `shellexecute-on-windows` feature and NOT its `insecure` one
# (which is the `cmd /c start` behaviour we're removing). macOS/Linux already
# pass the URL as a single argv element to open/xdg-open and need nothing.
[target.'cfg(target_os = "windows")'.dependencies]
tauri-plugin-opener = "2"

[dev-dependencies]
# Already resolved in Cargo.lock as a normal dependency of tauri-plugin-updater,
# so this adds no new package. Tests run on parallel threads, so each needs its
# own scratch dir — and TempDir cleans up on drop even when a test panics.
tempfile = "3"

